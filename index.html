<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="robots" content="noindex">
<title>Home Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: header band (clock · weather · bus), three cards (week · to-do · news), forecast strip */
:root{
  --bg:#0F1417; --card:#161D21; --line:#26313A; --edge:#33404A;
  --fg:#E9EDEB; --fg2:#C9D1CE; --muted:#9BA7A3; --faint:#7E8A86;
  --accent:#7FCBB9; --accent-soft:rgba(127,203,185,.12);
  --warm:#E6B566; --rain:#8FB7E6; --bad:#E89A8C;
  --display:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column;gap:2.2vh;
  padding:max(3.4vh,env(safe-area-inset-top)) max(2.7vw,env(safe-area-inset-right)) max(3.4vh,env(safe-area-inset-bottom)) max(2.7vw,env(safe-area-inset-left))}

header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.hello{display:flex;flex-direction:column;gap:14px;min-width:0}
.greet-row{display:flex;align-items:center;gap:16px}
.greet{margin:0;font-family:var(--display);font-size:46px;font-weight:500;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.sky{width:64px;height:64px;flex:none}
.sky svg{width:100%;height:100%;overflow:visible}
.sky .rays{transform-origin:32px 32px;animation:spin 28s linear infinite}
.sky .core{transform-origin:32px 32px;animation:breathe 5s ease-in-out infinite}
.sky .moon{transform-origin:32px 32px;animation:sway 7s ease-in-out infinite}
.sky .star{animation:twinkle 3.2s ease-in-out infinite}
.sky .star:nth-of-type(2){animation-delay:1.1s}.sky .star:nth-of-type(3){animation-delay:2.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes sway{50%{transform:rotate(-8deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--edge)}
.seg button{min-height:36px;padding:4px 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sched{font-size:13px;color:var(--muted)}
.date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.clock-row{display:flex;align-items:baseline;gap:18px;margin-top:6px}
.clock{font-family:var(--display);font-size:72px;font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.greet{font-size:18px;color:var(--fg2)}
.pill{min-height:40px;padding:4px 14px;border-radius:999px;border:1px solid var(--edge);background:var(--card);color:var(--fg2);font-size:13px;font-weight:500;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chips{display:flex;gap:14px}
.chip{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:20px;background:var(--card);min-width:290px}
.big{font-family:var(--display);font-size:34px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.chip .lead{font-size:15px;font-weight:600}
.small{font-size:12px;color:var(--muted)}
.line-badge{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;font-weight:600;flex:none}

main{flex:1;min-height:0;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px}
.card{background:var(--card);border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:baseline}
h2,h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h3{font-size:13px}
.rule{height:1px;background:var(--line);flex:none}

.day{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding:7px 10px;border-radius:10px}
.day .d{font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums}
.day .ev{font-size:14px;color:var(--faint);line-height:1.45}
.day .ev b{font-weight:500;color:var(--fg)}
.day .ev .routine{color:var(--muted)}
.day.past{opacity:.5}
.day.today{background:var(--accent-soft);outline:1px solid var(--accent)}
.day.today .d{color:var(--accent);font-weight:600}
.upcoming{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--fg2);overflow:hidden}
.upcoming .u{display:grid;grid-template-columns:64px 1fr;gap:12px}
.upcoming .u span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}

.todo{display:flex;gap:14px;align-items:flex-start;width:100%;min-height:48px;padding:8px 0;border:0;background:none;text-align:left;font-size:16px;line-height:1.4;cursor:pointer;color:var(--fg)}
.todo:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.box{width:24px;height:24px;border:1.6px solid var(--accent);border-radius:7px;flex:none;margin-top:0;display:flex;align-items:center;justify-content:center;transition:background .2s}
.todo[aria-pressed="true"] .box{background:var(--accent)}
.todo[aria-pressed="true"] .box svg{opacity:1}
.box svg{opacity:0;transition:opacity .2s}
.todo[aria-pressed="true"] .tt2{color:var(--faint);text-decoration:line-through}
.bday{color:var(--warm)}
.watch{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4}
.watch .note{color:var(--muted)}
.foot{margin-top:auto;font-size:12px;color:var(--faint)}

.news{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px}
.news li{display:grid;grid-template-columns:28px 1fr;gap:10px}
.news .n{font-family:var(--display);font-size:22px;color:var(--accent);line-height:1.1}
.news .t{font-size:16px;font-weight:600;line-height:1.3}
.news .s{font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px}

.forecast{flex:none;background:var(--card);border-radius:22px;padding:14px 24px;display:grid;grid-template-columns:120px repeat(7,minmax(0,1fr));gap:8px;align-items:center}
.fd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px}
.fd.today{background:var(--accent-soft)}
.fd .w{font-size:13px;color:var(--fg2)}
.fd.today .w{color:var(--accent);font-weight:600}
.fd .tt{font-size:15px;font-variant-numeric:tabular-nums}
.fd .tt span{color:var(--muted)}
.fd .pp{font-size:11px;color:var(--rain);min-height:14px}

.empty{font-size:14px;color:var(--faint);line-height:1.5}
.stale{color:var(--warm)}

/* Off hours: nearly black, tiny dim clock that drifts to avoid any image retention */
#sleep{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
#sleep .c{font-family:var(--display);font-size:44px;color:#2A3236;font-variant-numeric:tabular-nums;position:absolute}
#sleep .hint{position:absolute;bottom:28px;font-size:12px;color:#20272B}

/* Unlock */
#unlock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30}
#unlock form{display:flex;flex-direction:column;gap:14px;width:min(420px,90vw)}
#unlock label{font-size:15px;color:var(--fg2)}
#unlock input{font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1px solid var(--edge);background:var(--card);color:var(--fg)}
#unlock button{min-height:48px;border-radius:14px;border:0;background:var(--accent);color:var(--bg);font-weight:600;font-size:16px;cursor:pointer}
#unlock .err{color:var(--bad);font-size:14px;min-height:18px}

@media (max-width:900px){
  body{overflow:auto}
  header{flex-direction:column;align-items:flex-start}
  .chips{flex-wrap:wrap}
  main{grid-template-columns:1fr}
  .forecast{grid-template-columns:repeat(4,minmax(0,1fr))}
  .forecast>div:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hello">
      <div class="greet-row">
        <div class="sky" id="sky" aria-hidden="true"></div>
        <h1 class="greet" id="greet">Hello</h1>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Today is">
          <button type="button" id="segOffice" aria-pressed="false">Office day</button>
          <button type="button" id="segWfh" aria-pressed="false">Home day</button>
        </div>
        <span class="sched" id="schedNote"></span>
        <button type="button" class="pill" id="stayBtn" aria-pressed="false">Keep on 1 hr</button>
      </div>
    </div>
    <div class="chips">
      <div class="chip">
        <div id="wxIcon" aria-hidden="true"></div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:baseline;gap:10px"><div class="big" id="wxNow">--°</div><div class="small" id="wxHL"></div></div>
          <div class="lead" id="wxAdvice">Loading weather…</div>
          <div class="small" id="wxNote"></div>
        </div>
      </div>
      <div class="chip">
        <div class="line-badge" id="lineBadge">–</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:baseline;gap:8px"><div class="big" id="busMin" style="color:var(--accent)">--</div><div style="font-size:15px" id="busUnit">min</div><div class="small" id="busNext"></div></div>
          <div class="lead" id="busTo">Bus</div>
          <div class="small" id="busAt">Loading departures…</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="card" aria-labelledby="h-week">
      <div class="card-head"><h2 id="h-week">This week</h2><div class="small" id="weekRange"></div></div>
      <div id="week" style="display:flex;flex-direction:column;gap:2px"><div class="empty">Calendar loads after unlock.</div></div>
      <div class="rule"></div>
      <h3>Coming up · next 4 weeks</h3>
      <div class="upcoming" id="upcoming"></div>
    </section>

    <section class="card" aria-labelledby="h-todo">
      <div class="card-head"><h2 id="h-todo">To-do</h2><div class="small" id="todoCount"></div></div>
      <div id="todos"></div>
      <div class="rule"></div>
      <h3>Watching</h3>
      <div id="watching" style="display:flex;flex-direction:column;gap:12px"></div>
      <div class="foot" id="dataAge"></div>
    </section>

    <section class="card" aria-labelledby="h-news">
      <div class="card-head"><h2 id="h-news">Top 3 news</h2><div class="small">via 1440</div></div>
      <ol class="news" id="news"></ol>
    </section>
  </main>

  <section class="forecast" aria-label="7-day forecast">
    <div><h2>7 days</h2><div class="small">Forecast</div></div>
    <div id="fc" style="display:contents"></div>
  </section>
</div>

<div id="sleep" hidden><div class="c" id="sleepClock"></div><div class="hint">Tap to wake for 2 minutes</div></div>

<div id="unlock" hidden>
  <form id="unlockForm">
    <label for="pass">Passphrase for your calendar, to-do list and news</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="err" id="unlockErr"></div>
    <button type="submit">Unlock on this iPad</button>
  </form>
</div>

<script>
"use strict";
/* ---------- Settings ----------
   Everything personal (name, location, bus stop, schedule) lives inside the encrypted
   data.json under "settings", so this public file reveals nothing about its owner. */
const CFG = { tz: "Europe/Zurich", dataUrl: "data.json" };
let S = null; // filled from settings once data.json is unlocked
const $ = (id) => document.getElementById(id);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
S = store.get("settings");
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const hm  = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- Day mode & screen schedule ---------- */
function dayMode(now){
  const o = store.get("override");
  if (o && o.date === ymd(now)) return o.mode;
  if (!S) return "wfh";
  return S.wfhDays.includes(now.getDay()) ? "wfh" : "office";
}
function scheduledOn(now){
  const m = now.getHours()*60 + now.getMinutes();
  if (!S) return true;
  const wins = dayMode(now) === "wfh" ? S.onWfh : S.onOffice;
  return wins.some(([a,b]) => m >= a && m < b);
}
function awakeUntil(){ return store.get("awakeUntil") || 0; }
function isOn(now){ return scheduledOn(now) || now.getTime() < awakeUntil(); }

function defaultMode(now){ return S && S.wfhDays.includes(now.getDay()) ? "wfh" : "office"; }
function setMode(mode){
  const now = new Date();
  if (mode === defaultMode(now)) store.del("override"); else store.set("override", { date: ymd(now), mode });
  tick();
}
$("segOffice").addEventListener("click", () => setMode("office"));
$("segWfh").addEventListener("click", () => setMode("wfh"));
const fmtMin = (m) => pad(Math.floor(m/60) % 24) + ":" + pad(m % 60);
function scheduleNote(now){
  if (!S) return "";
  const wins = dayMode(now) === "wfh" ? S.onWfh : S.onOffice;
  const gaps = [];
  for (let i = 0; i + 1 < wins.length; i++) gaps.push(fmtMin(wins[i][1]) + "–" + fmtMin(wins[i+1][0]));
  const end = wins[wins.length-1][1];
  return gaps.length ? "Screen sleeps " + gaps.join(", ") : "Screen on until " + (end >= 1440 ? "midnight" : fmtMin(end));
}
const SKY = {
  sun: '<svg viewBox="0 0 64 64"><g class="rays" stroke="#E6B566" stroke-width="2.4" stroke-linecap="round"><path d="M32 4v8M32 52v8M4 32h8M52 32h8M12.2 12.2l5.6 5.6M46.2 46.2l5.6 5.6M12.2 51.8l5.6-5.6M46.2 17.8l5.6-5.6"/></g><circle class="core" cx="32" cy="32" r="12" fill="#E6B566"/></svg>',
  dusk: '<svg viewBox="0 0 64 64"><g class="rays" stroke="#E6B566" stroke-width="2.4" stroke-linecap="round" opacity=".7"><path d="M32 8v6M10 32h6M48 32h6M16.4 16.4l4.2 4.2M43.4 20.6l4.2-4.2"/></g><circle class="core" cx="32" cy="36" r="11" fill="#E6B566"/><path d="M6 44h52" stroke="#9BA7A3" stroke-width="2.4" stroke-linecap="round"/><rect x="0" y="45" width="64" height="19" fill="var(--bg)"/></svg>',
  moon: '<svg viewBox="0 0 64 64"><path class="moon" d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z" fill="#E9EDEB"/><circle class="star" cx="12" cy="14" r="2" fill="#8FB7E6"/><circle class="star" cx="54" cy="10" r="1.6" fill="#8FB7E6"/><circle class="star" cx="8" cy="40" r="1.4" fill="#8FB7E6"/></svg>'
};
let skyPhase = "";
$("stayBtn").addEventListener("click", () => {
  const until = awakeUntil() > Date.now() + 2*60*1000 ? 0 : Date.now() + 60*60*1000;
  store.set("awakeUntil", until);
  tick();
});
$("sleep").addEventListener("click", () => {
  store.set("awakeUntil", Date.now() + 2*60*1000);
  tick();
});

/* Wake lock: held only while the screen should be on, so Auto-Lock can sleep the iPad otherwise */
let wakeLock = null;
async function holdWake(want){
  try {
    if (want && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch(e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { wakeLock = null; tick(); refreshAll(); });

/* ---------- Clock tick ---------- */
function tick(){
  const now = new Date();
  const on = isOn(now);
  $("sleep").hidden = on;
  holdWake(on);
  const h = now.getHours();
  const nm = S && S.name ? ", " + S.name : "";
  $("greet").textContent = (h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening") + nm;
  const mode = dayMode(now);
  $("segOffice").setAttribute("aria-pressed", mode === "office" ? "true" : "false");
  $("segWfh").setAttribute("aria-pressed", mode === "wfh" ? "true" : "false");
  $("schedNote").textContent = scheduleNote(now);
  const phase = h >= 6 && h < 17 ? "sun" : h >= 17 && h < 19 ? "dusk" : "moon";
  if (phase !== skyPhase) { $("sky").innerHTML = SKY[phase]; skyPhase = phase; }
  const stay = awakeUntil() > now.getTime() + 2*60*1000;
  $("stayBtn").setAttribute("aria-pressed", stay ? "true" : "false");
  $("stayBtn").textContent = stay ? "On until " + hm(new Date(awakeUntil())) + " · cancel" : "Keep on 1 hr";
  if (!on) {
    const c = $("sleepClock"); c.textContent = hm(now);
    const k = now.getHours()*60 + now.getMinutes();
    c.style.left = (20 + (k*7) % 60) + "%"; c.style.top = (20 + (k*11) % 55) + "%";
  }
  renderBusCountdown();
}

/* ---------- Weather (Open-Meteo, no key) ---------- */
const WX = {
  sun:   '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#E6B566" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  part:  '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#E6B566" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="3.5"/><path d="M9 2.5v1.5M2.5 9H4M4.4 4.4l1 1M13.6 4.4l-1 1"/><path d="M10 20h8a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.5 1.5A2.8 2.8 0 0 0 10 20z" stroke="#C9D1CE" fill="#161D21"/></svg>',
  cloud: '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#C9D1CE" stroke-width="1.5" stroke-linecap="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></svg>',
  fog:   '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#C9D1CE" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></svg>',
  rain:  '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#8FB7E6" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 15z" stroke="#C9D1CE"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>',
  snow:  '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#E9EDEB" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 15z" stroke="#C9D1CE"/><path d="M9 19h.01M13 20h.01M17 19h.01"/></svg>',
  storm: '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#E6B566" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 15z" stroke="#C9D1CE"/><path d="M12 15l-2 4h3l-2 4"/></svg>'
};
function wxKind(c){
  if (c === 0 || c === 1) return ["sun","Clear"];
  if (c === 2) return ["part","Partly cloudy"];
  if (c === 3) return ["cloud","Cloudy"];
  if (c === 45 || c === 48) return ["fog","Fog"];
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ["snow","Snow"];
  if (c >= 95) return ["storm","Thunderstorms"];
  if (c >= 51) return ["rain","Rain"];
  return ["cloud","Cloudy"];
}
const icon = (k, w) => WX[k].replace(/W/g, w);

async function loadWeather(){
  if (!S) return;
  const u = "https://api.open-meteo.com/v1/forecast?latitude=" + S.lat + "&longitude=" + S.lon +
    "&current=temperature_2m,weather_code&hourly=precipitation_probability,apparent_temperature" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=" + encodeURIComponent(CFG.tz) + "&forecast_days=7";
  try {
    const r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const w = await r.json();
    store.set("wx", w);
    renderWeather(w, false);
  } catch(e) {
    const w = store.get("wx");
    if (w) renderWeather(w, true); else $("wxAdvice").textContent = "Weather unavailable";
  }
}
function renderWeather(w, stale){
  const [k, label] = wxKind(w.current.weather_code);
  $("wxIcon").innerHTML = icon(k, 44);
  $("wxNow").textContent = Math.round(w.current.temperature_2m) + "°";
  $("wxHL").textContent = "H " + Math.round(w.daily.temperature_2m_max[0]) + "° L " + Math.round(w.daily.temperature_2m_min[0]) + "°";

  // Advice from commute hours today (or tomorrow once today's commute is over)
  const now = new Date();
  const pick = (dayIdx) => {
    const date = w.daily.time[dayIdx];
    let rain = 0, feels = 99, rainAt = "";
    w.hourly.time.forEach((t, i) => {
      if (!t.startsWith(date)) return;
      const h = +t.slice(11, 13);
      if (S.commute.some(([a,b]) => h >= a && h < b)) {
        const pp = w.hourly.precipitation_probability[i] ?? 0;
        if (pp > rain) { rain = pp; rainAt = t.slice(11, 16); }
        feels = Math.min(feels, w.hourly.apparent_temperature[i] ?? 99);
      }
    });
    return { rain, feels, rainAt };
  };
  const forTomorrow = now.getHours() >= 19;
  const a = pick(forTomorrow ? 1 : 0);
  const wet = a.rain >= S.umbrellaPct;
  $("wxAdvice").textContent = (forTomorrow ? "Tomorrow: " : "") + (wet ? "Take an umbrella" : "No umbrella needed");
  $("wxAdvice").style.color = wet ? "var(--rain)" : "var(--accent)";
  let note = label + (a.rain >= S.umbrellaPct ? " · " + a.rain + "% around " + a.rainAt : "") + (stale ? " · last known" : "");
  if (!forTomorrow && a.rain < S.umbrellaPct && (w.daily.precipitation_probability_max[1] ?? 0) >= S.umbrellaPct) note = label + " · rain likely tomorrow";
  $("wxNote").textContent = note;
  $("wxNote").classList.toggle("stale", stale);

  $("fc").innerHTML = w.daily.time.map((d, i) => {
    const dt = new Date(d + "T12:00:00");
    const [kk] = wxKind(w.daily.weather_code[i]);
    const p = w.daily.precipitation_probability_max[i];
    return '<div class="fd' + (i === 0 ? " today" : "") + '"><div class="w">' + (i === 0 ? "Today" : DOW[dt.getDay()]) + "</div>" +
      icon(kk, 30) + '<div class="tt">' + Math.round(w.daily.temperature_2m_max[i]) + "° <span>" + Math.round(w.daily.temperature_2m_min[i]) + "°</span></div>" +
      '<div class="pp">' + (p >= 30 ? p + "% rain" : "") + "</div></div>";
  }).join("");
}

/* ---------- Bus: transport.opendata.ch, falling back to search.ch ---------- */
let deps = [];
const lineOf = (d) => String(d.number || d.line || (d.name || "").replace(/^\D+/, "") || "").trim();
async function getJSON(u){ const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function viaOpendata(){
  let st = store.get("stop");
  if (!st || st.q !== S.stopQuery) {
    st = null;
    for (const q of [S.stopQuery, "Massagno, " + S.stopQuery, "Lugano, " + S.stopQuery]) {
      const j = await getJSON("https://transport.opendata.ch/v1/locations?type=station&query=" + encodeURIComponent(q));
      const hit = (j.stations || []).find(x => x.id && (x.name || "").toLowerCase().includes(S.stopQuery.toLowerCase()));
      if (hit) { st = { id: hit.id, name: hit.name, q: S.stopQuery }; break; }
    }
    if (!st) throw new Error("stop not found");
    store.set("stop", st);
  }
  const j = await getJSON("https://transport.opendata.ch/v1/stationboard?limit=60&id=" + encodeURIComponent(st.id));
  return (j.stationboard || []).filter(d => lineOf(d) === String(S.line)).map(d => {
    const s0 = d.stop || {};
    const ts = (s0.prognosis && s0.prognosis.departureTimestamp) || s0.departureTimestamp;
    return { t: ts * 1000, to: d.to || "", late: s0.delay || 0 };
  }).filter(d => d.t);
}
async function viaSearch(){
  const stop = (S.stopFull || ("Massagno, " + S.stopQuery));
  const j = await getJSON("https://search.ch/timetable/api/stationboard.json?show_delays=1&limit=40&transportation_types=bus&stop=" + encodeURIComponent(stop));
  return (j.connections || []).filter(c => String(c.line) === String(S.line)).map(c => {
    const late = parseInt(String(c.dep_delay || "0").replace("+", ""), 10) || 0;
    const base = new Date(String(c.time).replace(" ", "T")).getTime();
    return { t: base + late * 60000, to: (c.terminal && c.terminal.name) || "", late };
  }).filter(d => d.t);
}
async function loadBus(){
  if (!S) return;
  $("lineBadge").textContent = S.line;
  let list = null, errs = [];
  for (const src of [viaOpendata, viaSearch]) {
    try { list = await src(); if (list.length) break; errs.push(src.name.replace("via","") + ": no line " + S.line); }
    catch(e) { errs.push(src.name.replace("via","") + ": " + (e.message || "failed")); if (src === viaOpendata) store.del("stop"); }
  }
  if (list && list.length) {
    const toward = S.towards ? list.filter(d => d.to.toLowerCase().includes(S.towards.toLowerCase())) : [];
    deps = (toward.length ? toward : list).sort((a, b) => a.t - b.t);
    store.set("deps", deps);
    $("busTo").textContent = (S.stopLabel || S.stopQuery) + " → " + deps[0].to.replace(/^[^,]+,\s*/, "");
  } else {
    deps = (store.get("deps") || []).filter(d => d.t > Date.now());
    if (!deps.length) { $("busMin").textContent = "--"; $("busNext").textContent = ""; $("busAt").textContent = "Can't load departures (" + errs.join("; ") + ")"; return; }
  }
  renderBusCountdown();
}
function renderBusCountdown(){
  const now = Date.now();
  const up = deps.filter(d => d.t > now - 30*1000);
  if (!up.length) { if (deps.length) { $("busMin").textContent = "--"; $("busAt").textContent = "No more line " + S.line + " departures listed"; } return; }
  const mins = (d) => Math.max(0, Math.round((d.t - now) / 60000));
  const first = up[0];
  const m = mins(first);
  $("busMin").textContent = m === 0 ? "Now" : String(m);
  $("busUnit").textContent = m === 0 ? "" : "min";
  $("busNext").textContent = up.slice(1, 3).length ? "then " + up.slice(1, 3).map(mins).join(" · ") : "";
  $("busAt").textContent = "Arrives at " + (S.stopLabel || S.stopQuery) + " " + hm(new Date(first.t)) + (first.late ? " · " + first.late + " min late" : "");
}

/* ---------- Personal data (encrypted data.json) ---------- */
function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decrypt(env, pass){
  const key = await deriveKey(pass, b64(env.salt));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadData(){
  const pass = store.get("pass");
  if (!pass) { $("unlock").hidden = false; return; }
  try {
    const r = await fetch(CFG.dataUrl + "?t=" + Date.now(), { cache: "no-store" });
    const env = await r.json();
    const data = await decrypt(env, pass);
    store.set("data", data);
    renderData(data);
  } catch(e) {
    const d = store.get("data");
    if (d) renderData(d, true);
    else if (e && e.name === "OperationError") { store.del("pass"); $("unlockErr").textContent = "That passphrase didn't open the data. Try again."; $("unlock").hidden = false; }
  }
}
$("unlockForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pass = $("pass").value;
  if (!pass) return;
  try {
    const r = await fetch(CFG.dataUrl + "?t=" + Date.now(), { cache: "no-store" });
    const data = await decrypt(await r.json(), pass);
    store.set("pass", pass); store.set("data", data);
    $("unlock").hidden = true; $("pass").value = ""; $("unlockErr").textContent = "";
    renderData(data);
  } catch(e) {
    $("unlockErr").textContent = "That passphrase didn't open the data. Check it and try again.";
  }
});

/* Ticks are kept on this iPad. A ticked item shows struck through today and is hidden from tomorrow. */
let lastTodos = [];
function renderTodos(todos){
  lastTodos = todos;
  const done = store.get("done") || {};
  const today = ymd(new Date());
  const visible = todos.filter(t => !done[t.title] || done[t.title] === today);
  const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  $("todos").innerHTML = visible.length ? visible.map((t, i) =>
    '<button type="button" class="todo" data-i="' + i + '" aria-pressed="' + (done[t.title] ? "true" : "false") + '"><span class="box" aria-hidden="true">' + check + '</span><span class="tt2">' + esc(t.title) + "</span></button>").join("")
    : '<div class="empty">All clear.</div>';
  $("todos").querySelectorAll(".todo").forEach(b => b.addEventListener("click", () => {
    const t = visible[+b.dataset.i]; const dn = store.get("done") || {};
    if (dn[t.title]) delete dn[t.title]; else dn[t.title] = ymd(new Date());
    store.set("done", dn); renderTodos(lastTodos);
  }));
  const open = visible.filter(t => !done[t.title]).length;
  $("todoCount").textContent = open + " open";
}

function renderData(d, stale){
  if (d.settings) {
    const first = !S || JSON.stringify(S) !== JSON.stringify(d.settings);
    S = d.settings; store.set("settings", S);
    if (first) { loadWeather(); loadBus(); tick(); }
  }
  const now = new Date(); const today = ymd(now);
  // Week: Monday to Sunday containing today
  const mon = new Date(now); mon.setHours(12,0,0,0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const byDay = {};
  (d.events || []).forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const dt = new Date(mon); dt.setDate(mon.getDate() + i);
    const key = ymd(dt);
    const evs = byDay[key] || [];
    const txt = evs.length
      ? evs.map(e => e.birthday ? '<span class="bday">' + esc(e.title) + "</span>" : e.routine ? '<span class="routine">' + esc((e.time ? e.time + " " : "") + e.title) + "</span>" : "<b>" + esc(e.time ? e.time + " " : "") + "</b>" + esc(e.title)).join("<br>")
      : (key === today ? "Nothing scheduled" : "Free");
    rows.push('<div class="day' + (key === today ? " today" : key < today ? " past" : "") + '"><div class="d">' + DOW[dt.getDay()] + " " + dt.getDate() + '</div><div class="ev">' + txt + "</div></div>");
  }
  $("week").innerHTML = rows.join("");
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  $("weekRange").textContent = mon.getDate() + " – " + sun.getDate() + " " + MON[sun.getMonth()].slice(0,3);
  const weekEnd = ymd(sun);
  const later = (d.events || []).filter(e => e.date > weekEnd && !e.routine).slice(0, 6);
  $("upcoming").innerHTML = later.length
    ? later.map(e => { const dt = new Date(e.date + "T12:00:00"); return '<div class="u"><span>' + DOW[dt.getDay()] + " " + dt.getDate() + '</span><span' + (e.birthday ? ' class="bday"' : "") + ">" + esc(e.title) + "</span></div>"; }).join("")
    : '<div class="empty">Nothing booked yet.</div>';

  renderTodos(d.todos || []);
  const eye = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6B566" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  $("watching").innerHTML = (d.watching || []).map(w => '<div class="watch">' + eye + "<div>" + esc(w.title) + (w.note ? ' <span class="note">· ' + esc(w.note) + "</span>" : "") + "</div></div>").join("") || '<div class="empty">Nothing on watch.</div>';

  $("news").innerHTML = (d.news || []).slice(0,3).map((n, i) => '<li><div class="n">' + (i+1) + '</div><div><div class="t">' + esc(n.title) + '</div><div class="s">' + esc(n.summary) + "</div></div></li>").join("") || '<div class="empty">No digest yet today.</div>';

  const upd = d.updated ? new Date(d.updated) : null;
  const old = !upd || (Date.now() - upd.getTime()) > 30*60*60*1000;
  $("dataAge").textContent = upd ? "Updated " + DOW[upd.getDay()] + " " + hm(upd) + (stale ? " · offline" : "") : "";
  $("dataAge").classList.toggle("stale", old || !!stale);
}

/* ---------- Loop ---------- */
function refreshAll(){ loadWeather(); loadBus(); loadData(); }
tick(); refreshAll();
setInterval(tick, 15 * 1000);
setInterval(loadBus, 60 * 1000);
setInterval(loadWeather, 20 * 60 * 1000);
setInterval(loadData, 15 * 60 * 1000);
// Pick up new versions of the page itself once a night
setInterval(() => { const n = new Date(); if (n.getHours() === 3 && n.getMinutes() === 0) location.reload(); }, 60 * 1000);
</script>
